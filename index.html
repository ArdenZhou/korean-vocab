<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>韩语记单词</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1a1a2e;
    color: #e6e6e6;
    line-height: 1.5;
    padding: 12px;
    overflow-x: hidden;
  }
  h1 { font-size: 1.3rem; text-align: center; margin-bottom: 10px; letter-spacing: 1px; }
  h1 .ko { color: #4ade80; }

  /* 卡片 */
  .card {
    background: #16213e;
    border: 1px solid #2a3b66;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }

  /* 通用控件 */
  label { font-size: 0.88rem; color: #9aa; display: block; margin-bottom: 4px; }
  select, button, input[type=number] {
    background: #0f1a30;
    color: #e6e6e6;
    border: 1px solid #2a3b66;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: inherit;
  }
  select:hover, button:hover { border-color: #4ade80; }
  button.primary { background: #2563eb; border-color: #2563eb; }
  button.primary:hover { background: #1d4ed8; }
  button.danger { background: #b91c1c; border-color: #b91c1c; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 0 0 auto; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button { padding: 6px 10px; font-size: 0.85rem; }
  .seg button.active { background: #2563eb; border-color: #2563eb; }

  /* 首页：课程列表 */
  #home .lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
  #home .lessons button {
    padding: 14px 0;
    text-align: center;
    font-size: 0.95rem;
  }
  #home .lessons button .cnt { display: block; font-size: 0.72rem; color: #9aa; margin-top: 2px; }

  /* 单词显示 */
  .word-ko { font-size: 2.6rem; text-align: center; letter-spacing: 1px; margin: 8px 0; }
  .word-explain { font-size: 1.2rem; text-align: center; color: #cdd; margin-bottom: 6px; }
  .word-meta { text-align: center; font-size: 0.85rem; color: #9aa; }
  .word-note { text-align: center; font-size: 0.82rem; color: #fbbf24; margin-top: 6px; background: rgba(251,191,36,0.08); border-radius: 6px; padding: 6px; }
  .progress { font-size: 0.8rem; color: #9aa; text-align: center; margin-bottom: 8px; }

  /* 听写 */
  .quiz-prompt { text-align: center; font-size: 1.15rem; color: #cdd; margin: 10px 0; min-height: 2rem; }
  .quiz-input-area { margin: 10px 0; }
  .quiz-answer-input {
    width: 100%;
    text-align: center;
    font-size: 1.8rem;
    letter-spacing: 2px;
    background: #0f1a30;
    color: #4ade80;
    border: 2px solid #2a3b66;
    border-radius: 8px;
    padding: 10px;
    font-family: inherit;
  }
  .quiz-answer-input:focus { outline: none; border-color: #4ade80; }
  .quiz-correct { color: #4ade80; }
  .quiz-wrong { color: #f87171; }
  .quiz-result { text-align: center; margin: 10px 0; }
  .quiz-result .correct-ko { font-size: 1.8rem; color: #4ade80; }
  .quiz-result .your-ko { font-size: 1.1rem; color: #f87171; text-decoration: line-through; }

  /* 虚拟键盘 */
  .keyboard { margin-top: 10px; }
  .keyboard-tabs { display: flex; gap: 4px; margin-bottom: 6px; }
  .keyboard-tabs button { padding: 4px 10px; font-size: 0.8rem; }
  .keyboard-tabs button.active { background: #2563eb; border-color: #2563eb; }
  .keyboard-grid { display: grid; gap: 3px; }
  .keyboard-grid button {
    padding: 10px 0;
    font-size: 1rem;
    text-align: center;
    background: #0f1a30;
  }
  .keyboard-grid button:hover { background: #1a2950; }
  .keyboard-grid button.special { font-size: 0.75rem; color: #9aa; }

  /* 手写画板 */
  .draw-wrap { display: none; }
  .draw-wrap.show { display: block; }
  .draw-canvas {
    background: #fff;
    border: 2px solid #2a3b66;
    border-radius: 8px;
    width: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  .draw-controls { display: flex; gap: 6px; margin-top: 6px; justify-content: center; }

  /* 隐藏 */
  .hidden { display: none !important; }

  /* 导航底栏 */
  .navbar {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
  }
  .navbar button { flex: 1; padding: 10px; }

  /* 结果统计 */
  .stat-line { font-size: 0.95rem; margin: 4px 0; }
  .stat-line .ok { color: #4ade80; }
  .stat-line .bad { color: #f87171; }

  @media (max-width: 500px) {
    .word-ko { font-size: 2.2rem; }
    h1 { font-size: 1.1rem; }
  }
</style>
</head>
<body>
<h1>韩语记单词 <span class="ko">한국어</span></h1>

<!-- 错误提示（正常时不显示，用于诊断） -->
<div id="errorBox" style="display:none;background:#7f1d1d;border:1px solid #ef4444;border-radius:8px;padding:10px;margin:8px 0;font-size:0.85rem;color:#fecaca;white-space:pre-wrap;word-break:break-all;"></div>

<!-- ========== 首页 ========== -->
<div id="home">
  <div class="card">
    <label>选择课程</label>
    <div class="lessons" id="lessonList"></div>
  </div>
  <div class="card">
    <label>模式选择</label>
    <div class="seg" id="modeSelect" style="margin-top:6px;">
      <button data-mode="study" class="active">学习</button>
      <button data-mode="quiz">听写复习</button>
    </div>
  </div>
  <div class="card" id="quizOptions" style="display:none;">
    <label>听写设置</label>
    <div style="margin-top:6px;">
      <label style="margin-top:8px;">出题方式</label>
      <div class="seg" id="quizType">
        <button data-type="sound" class="active">读发音+中文</button>
        <button data-type="meaning">只看中文</button>
      </div>
      <label style="margin-top:10px;">顺序</label>
      <div class="seg" id="orderType">
        <button data-order="seq" class="active">正序</button>
        <button data-order="rev">倒序</button>
        <button data-order="rand">随机</button>
      </div>
      <label style="margin-top:10px;">每个单词朗读遍数</label>
      <div class="seg" id="repeatType">
        <button data-repeat="1" class="active">1 遍</button>
        <button data-repeat="2">2 遍</button>
        <button data-repeat="3">3 遍</button>
        <button data-repeat="4">4 遍</button>
        <button data-repeat="5">5 遍</button>
      </div>
      <label style="margin-top:10px;">每遍间隔（反应时间）</label>
      <div class="seg" id="gapType">
        <button data-gap="500">0.5 秒</button>
        <button data-gap="1500" class="active">1.5 秒</button>
        <button data-gap="3000">3 秒</button>
        <button data-gap="5000">5 秒</button>
      </div>
      <label style="margin-top:10px;">答错词优先重练</label>
      <div class="seg" id="retryType">
        <button data-retry="1" class="active">开</button>
        <button data-retry="0">关</button>
      </div>
    </div>
  </div>
  <div class="card">
    <button class="primary" id="startBtn" style="width:100%;padding:12px;font-size:1.05rem;">开始</button>
  </div>
  <div class="card" id="voiceCard">
    <label>🔊 发音状态</label>
    <div id="voiceInfo" style="font-size:0.85rem;color:#9aa;margin-top:6px;">检测中...</div>
    <button id="voiceTestBtn" style="margin-top:8px;font-size:0.85rem;">测试发音</button>
    <div id="voiceHelp" style="font-size:0.78rem;color:#fbbf24;margin-top:6px;display:none;">
      没有声音？iPhone/iPad 需在「设置 → 辅助功能 → 朗读内容 → 声音」里下载「韩语」语音，然后回到本页刷新。
    </div>
  </div>
  <div class="card" id="progressCard">
    <label>复习进度（保存在本机）</label>
    <div id="progressInfo" style="font-size:0.85rem;color:#9aa;margin-top:6px;">加载中...</div>
    <button id="clearProgressBtn" style="margin-top:8px;font-size:0.8rem;" class="danger">清除全部进度</button>
  </div>
</div>

<!-- ========== 学习模式 ========== -->
<div id="studyView" class="hidden">
  <div class="progress" id="studyProgress"></div>
  <div class="card">
    <div class="word-ko" id="studyWord"></div>
    <div class="word-explain" id="studyExplain"></div>
    <div class="word-meta" id="studyMeta"></div>
    <div class="word-note hidden" id="studyNote"></div>
    <div style="text-align:center;margin-top:12px;">
      <button id="studySpeakBtn" style="font-size:1rem;padding:10px 20px;">🔊 读发音</button>
    </div>
  </div>
  <div class="navbar">
    <button id="studyPrev">← 上一个</button>
    <button id="studyAuto" class="primary">自动朗读</button>
    <button id="studyNext">下一个 →</button>
  </div>
  <div class="navbar">
    <button id="studyExit">返回首页</button>
  </div>
</div>

<!-- ========== 听写模式 ========== -->
<div id="quizView" class="hidden">
  <div class="progress" id="quizProgress"></div>
  <div class="card">
    <div class="quiz-prompt" id="quizPrompt"></div>
    <div style="text-align:center;margin-bottom:8px;">
      <button id="quizSpeakBtn">🔊 再听一遍</button>
    </div>

    <!-- 拼写输入区 -->
    <div class="quiz-input-area" id="quizSpellArea">
      <input type="text" class="quiz-answer-input" id="quizInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="用键盘或下方虚拟键盘输入">
      <!-- 虚拟键盘 -->
      <div class="keyboard" id="keyboard">
        <div class="keyboard-tabs">
          <button data-kbd="consonant" class="active">辅音</button>
          <button data-kbd="vowel">元音</button>
          <button data-kbd="complex">复合</button>
        </div>
        <div class="keyboard-grid" id="kbdGrid"></div>
      </div>
    </div>

    <!-- 手写画板区 -->
    <div class="draw-wrap" id="drawWrap">
      <canvas class="draw-canvas" id="drawCanvas"></canvas>
      <div class="draw-controls">
        <button id="drawClear">清空</button>
      </div>
    </div>

    <!-- 答案显示区 -->
    <div class="quiz-result hidden" id="quizResult"></div>

    <div class="word-note hidden" id="quizNote"></div>
  </div>

  <!-- 输入方式切换 -->
  <div class="seg" id="inputMode" style="margin-bottom:8px;">
    <button data-im="spell" class="active">拼写输入</button>
    <button data-im="draw">手写输入</button>
  </div>

  <div class="navbar">
    <button id="quizPrev" disabled>← 上一个</button>
    <button id="quizSubmit" class="primary">提交 / 看答案</button>
    <button id="quizNext" class="hidden">下一个 →</button>
  </div>
  <div class="navbar">
    <button id="quizExit">返回首页</button>
  </div>
</div>

<!-- ========== 结束统计 ========== -->
<div id="summaryView" class="hidden">
  <div class="card">
    <h2 style="text-align:center;margin-bottom:12px;">本轮结束 🎉</h2>
    <div id="summaryContent"></div>
  </div>
  <div class="navbar">
    <button id="summaryAgain" class="primary">再来一轮</button>
    <button id="summaryHome">返回首页</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // 全局错误捕获：任何 JS 错误都显示到页面上，方便诊断
  window.onerror = function (msg, src, line, col) {
    try {
      var el = document.getElementById("errorBox");
      if (el) {
        el.style.display = "block";
        el.textContent = "⚠️ 出错了：" + msg + "\n位置：第 " + line + " 行";
      }
    } catch (e) {}
    return false;
  };

  // ====== 单词数据按课分组 ======
  var LESSONS = {};
  var LESSON_NUMS = [];
  (window.WORDS || []).forEach(function (w) {
    if (!LESSONS[w.lesson]) { LESSONS[w.lesson] = []; LESSON_NUMS.push(w.lesson); }
    LESSONS[w.lesson].push(w);
  });
  LESSON_NUMS.sort(function (a, b) { return a - b; });

  // ====== 进度存储 ======
  var STORE_KEY = "hangeul_progress_v1";
  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function saveProgress(p) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch (e) {}
  }
  var progress = loadProgress();
  function recordResult(word, ok) {
    if (!progress[word]) progress[word] = { seen: 0, correct: 0, wrong: 0 };
    progress[word].seen++;
    if (ok) progress[word].correct++; else progress[word].wrong++;
    saveProgress(progress);
  }

  // ====== TTS ======
  var gapMs = 1500; // 朗读间隔（毫秒），可在听写设置里调整
  var ttsVoice = null;
  var koVoices = [];
  function pickVoice() {
    try {
      var v = speechSynthesis.getVoices();
      var voices = (v && v.length) ? v : [];
      koVoices = voices.filter(function (x) {
        return x && (x.lang || "").toLowerCase().indexOf("ko") === 0;
      });
      // 优先选韩语，且优先「韩国」口音
      ttsVoice = koVoices.filter(function (x) { return (x.lang || "").indexOf("ko-KR") === 0; })[0]
        || koVoices[0]
        || null;
    } catch (e) {
      koVoices = [];
      ttsVoice = null;
    }
  }
  // 语音引擎初始化绝不阻塞主流程：任何异常都吞掉
  try {
    if ('speechSynthesis' in window) {
      pickVoice();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = pickVoice;
      }
    }
  } catch (e) {}

  // 检测韩语语音是否可用（用于首页提示）
  function checkVoiceStatus() {
    try {
      if (!('speechSynthesis' in window)) {
        return { ok: false, msg: "此浏览器不支持语音朗读" };
      }
      if (koVoices.length > 0) {
        return { ok: true, msg: "韩语发音可用 ✓" };
      }
      return { ok: false, msg: "未检测到韩语语音 → 见下方说明" };
    } catch (e) {
      return { ok: false, msg: "语音功能不可用" };
    }
  }

  // 预热：iOS 上必须在用户手势里触发一次，后续自动朗读才出声
  function warmUpTTS() {
    try {
      if (!('speechSynthesis' in window)) return;
      pickVoice();
      var u = new SpeechSynthesisUtterance(" ");
      u.volume = 0;
      u.lang = "ko-KR";
      if (ttsVoice) u.voice = ttsVoice;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function speakTTS(text, times, cb) {
    try {
      if (!('speechSynthesis' in window)) { if (cb) cb(); return; }
    } catch (e) { if (cb) cb(); return; }
    times = times || 1;
    var i = 0;
    function once() {
      if (i >= times) { if (cb) cb(); return; }
      i++;
      try {
        if (!ttsVoice) pickVoice(); // 语音列表可能刚加载完
        try { speechSynthesis.cancel(); } catch (e) {}
        var u = new SpeechSynthesisUtterance(text);
        u.lang = "ko-KR";
        if (ttsVoice) u.voice = ttsVoice;
        u.rate = 0.9;
        u.onend = function () { setTimeout(once, gapMs); };
        u.onerror = function () { setTimeout(once, gapMs); };
        speechSynthesis.speak(u);
      } catch (e) {
        // 语音失败不影响其他功能，直接跳到下一遍
        setTimeout(once, gapMs);
      }
    }
    once();
  }

  // 统一朗读入口：优先用预生成音频（audio/{idx}.m4a），失败则回退到浏览器 TTS
  function speak(text, times, cb, idx) {
    times = times || 1;
    var hasIdx = (typeof idx === "number");
    if (!hasIdx) {
      speakTTS(text, times, cb);
      return;
    }
    var i = 0;
    function next() {
      if (i >= times) { if (cb) cb(); return; }
      i++;
      var a = new Audio("audio/" + idx + ".m4a");
      var finished = false;
      function onDone() {
        if (finished) return;
        finished = true;
        setTimeout(next, gapMs);
      }
      function onFail() {
        if (finished) return;
        finished = true;
        // 音频加载/播放失败，回退到 TTS 播放剩余遍数
        speakTTS(text, times - i + 1, cb);
      }
      a.onended = onDone;
      a.onerror = onFail;
      try {
        var p = a.play();
        if (p && p.catch) p.catch(onFail);
      } catch (e) {
        onFail();
      }
    }
    next();
  }

  // ====== 状态 ======
  var state = {
    mode: "study",       // study / quiz
    lesson: 1,
    // quiz options
    quizType: "sound",   // sound / meaning
    order: "seq",        // seq / rev / rand
    repeat: 1,
    retryWrong: true,
    // 运行时
    queue: [],
    idx: 0,
    wrongSet: [],
    quizHistory: [],  // 已答单词的索引栈，用于「上一个」回退
    inputMode: "spell"   // spell / draw
  };

  // ====== UI 辅助 ======
  function $(id) { return document.getElementById(id); }
  function show(view) {
    ["home", "studyView", "quizView", "summaryView"].forEach(function (v) {
      $(v).classList.add("hidden");
    });
    $(view).classList.remove("hidden");
  }

  // ====== 首页：课程列表 ======
  function buildLessonList() {
    var html = "";
    LESSON_NUMS.forEach(function (n) {
      html += '<button data-lesson="' + n + '">第' + n + '课<span class="cnt">' + LESSONS[n].length + '词</span></button>';
    });
    $("lessonList").innerHTML = html;
    // 默认选第1课
    selectLesson(state.lesson);
  }
  function selectLesson(n) {
    state.lesson = n;
    var btns = $("lessonList").querySelectorAll("button");
    btns.forEach(function (b) {
      b.classList.toggle("active", parseInt(b.dataset.lesson, 10) === n);
      if (b.classList.contains("active")) { b.style.background = "#2563eb"; b.style.borderColor = "#2563eb"; }
      else { b.style.background = ""; b.style.borderColor = ""; }
    });
  }

  // ====== 首页：进度显示 ======
  function renderProgress() {
    var total = 0, seen = 0, wrongWords = 0;
    (window.WORDS || []).forEach(function (w) {
      total++;
      var p = progress[w.word];
      if (p) { seen++; if (p.wrong > p.correct) wrongWords++; }
    });
    $("progressInfo").innerHTML =
      "已练过 " + seen + " / " + total + " 个单词<br>" +
      "易错词（错>对）：" + wrongWords + " 个";
  }

  function renderVoiceStatus() {
    var st = checkVoiceStatus();
    $("voiceInfo").textContent = st.msg;
    $("voiceInfo").style.color = st.ok ? "#4ade80" : "#fbbf24";
    $("voiceHelp").style.display = st.ok ? "none" : "";
  }

  // ====== 构建队列 ======
  function buildQueue() {
    var arr = LESSONS[state.lesson].slice();
    if (state.order === "rev") arr.reverse();
    else if (state.order === "rand") {
      // Fisher-Yates
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
    }
    return arr;
  }

  // ====== 学习模式 ======
  function startStudy() {
    state.queue = buildQueue();
    state.idx = 0;
    show("studyView");
    renderStudy();
  }
  function renderStudy() {
    if (state.idx >= state.queue.length) {
      showSummary("study");
      return;
    }
    var w = state.queue[state.idx];
    $("studyProgress").textContent = (state.idx + 1) + " / " + state.queue.length + " — 第" + w.lesson + "课";
    $("studyWord").textContent = w.word;
    $("studyExplain").textContent = w.explain;
    $("studyMeta").textContent = w.pos;
    var noteEl = $("studyNote");
    if (w.note) { noteEl.textContent = "📝 " + w.note; noteEl.classList.remove("hidden"); }
    else { noteEl.classList.add("hidden"); }
    // 自动读
    speak(w.word, 1, null, w.idx);
  }
  $("studySpeakBtn").addEventListener("click", function () {
    if (state.queue[state.idx]) speak(state.queue[state.idx].word, 1, null, state.queue[state.idx].idx);
  });
  $("studyPrev").addEventListener("click", function () {
    if (state.idx > 0) { state.idx--; renderStudy(); }
  });
  $("studyNext").addEventListener("click", function () {
    state.idx++; renderStudy();
  });
  var autoTimer = null;
  $("studyAuto").addEventListener("click", function () {
    if (autoTimer) {
      clearInterval(autoTimer); autoTimer = null;
      this.textContent = "自动朗读"; this.classList.add("primary");
    } else {
      this.textContent = "停止自动"; this.classList.remove("primary");
      autoTimer = setInterval(function () {
        state.idx++;
        if (state.idx >= state.queue.length) {
          clearInterval(autoTimer); autoTimer = null;
          $("studyAuto").textContent = "自动朗读"; $("studyAuto").classList.add("primary");
          showSummary("study");
          return;
        }
        renderStudy();
      }, 3500);
    }
  });
  $("studyExit").addEventListener("click", function () {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; $("studyAuto").textContent = "自动朗读"; $("studyAuto").classList.add("primary"); }
    goHome();
  });

  // ====== 听写模式 ======
  var currentWord = null;
  var answered = false;

  function startQuiz() {
    state.queue = buildQueue();
    state.wrongSet = [];
    state.quizHistory = [];
    state.idx = 0;
    show("quizView");
    nextQuiz();
  }

  function nextQuiz() {
    answered = false;
    $("quizResult").classList.add("hidden");
    $("quizNote").classList.add("hidden");
    $("quizNext").classList.add("hidden");
    $("quizSubmit").classList.remove("hidden");
    $("quizPrev").disabled = (state.quizHistory.length === 0);
    $("quizInput").value = "";
    clearDraw();

    if (state.idx >= state.queue.length) {
      // 如果开了重练且本轮有错词，把错词重新入队
      if (state.retryWrong && state.wrongSet.length > 0) {
        state.queue = state.wrongSet.slice();
        state.wrongSet = [];
        state.idx = 0;
      } else {
        showSummary("quiz");
        return;
      }
    }
    currentWord = state.queue[state.idx];
    $("quizProgress").textContent = (state.idx + 1) + " / " + state.queue.length + " — 第" + currentWord.lesson + "课";

    // 出题
    if (state.quizType === "sound") {
      $("quizPrompt").innerHTML = '🔊 听发音并拼写<span style="display:block;font-size:1.4rem;color:#4ade80;margin-top:4px;">' + currentWord.explain + '</span>';
      speak(currentWord.word, state.repeat, null, currentWord.idx);
    } else {
      $("quizPrompt").innerHTML = '请拼写下面单词的韩文：<span style="display:block;font-size:1.4rem;color:#4ade80;margin-top:4px;">' + currentWord.explain + '</span>';
    }
  }

  function checkAnswer() {
    if (answered) return;
    answered = true;
    var correct = currentWord.word;

    // 手写模式：显示答案，让用户自己对照并标记对错
    if (state.inputMode === "draw") {
      var drawHtml = '<div style="margin-bottom:6px;">正确答案：</div>' +
        wordInfoHtml(currentWord) +
        '<div class="row" style="justify-content:center;margin-top:12px;">' +
        '<button id="selfCorrect" class="primary">✓ 我写对了</button>' +
        '<button id="selfWrong" class="danger">✗ 我写错了</button>' +
        '</div>';
      $("quizResult").innerHTML = drawHtml;
      $("quizResult").classList.remove("hidden");
      $("selfCorrect").addEventListener("click", function () { selfJudge(true); });
      $("selfWrong").addEventListener("click", function () { selfJudge(false); });
      speak(currentWord.word, 1, null, currentWord.idx);
      $("quizSubmit").classList.add("hidden");
      return;
    }

    // 拼写模式：自动判分
    var userAns = $("quizInput").value.trim();
    var isRight = (userAns === correct);
    recordResult(correct, isRight);

    var html = "";
    if (isRight) {
      html = '<div class="quiz-correct">✓ 正确！</div>' + wordInfoHtml(currentWord);
    } else {
      html = '<div class="quiz-wrong">✗ 错误</div>' +
             (userAns ? '<div class="your-ko">你的答案：' + userAns + '</div>' : '') +
             wordInfoHtml(currentWord);
      state.wrongSet.push(currentWord);
    }
    $("quizResult").innerHTML = html;
    $("quizResult").classList.remove("hidden");
    speak(currentWord.word, 1, null, currentWord.idx);

    state.quizHistory.push(state.idx);
    $("quizPrev").disabled = false;
    $("quizSubmit").classList.add("hidden");
    $("quizNext").classList.remove("hidden");
  }

  // 手写模式：用户自评对错
  function selfJudge(ok) {
    recordResult(currentWord.word, ok);
    if (!ok) state.wrongSet.push(currentWord);
    var mark = ok
      ? '<span class="quiz-correct">✓ 已标记：写对了</span>'
      : '<span class="quiz-wrong">✗ 已标记：写错了</span>';
    var btns = $("quizResult").querySelector(".row");
    if (btns) btns.outerHTML = mark;
    state.quizHistory.push(state.idx);
    $("quizPrev").disabled = false;
    $("quizNext").classList.remove("hidden");
  }

  // 生成单词完整信息（韩文、中文、词性、备注）
  function wordInfoHtml(w) {
    var h = '<div class="correct-ko">' + w.word + '</div>';
    h += '<div style="color:#cdd;font-size:1.05rem;margin-top:4px;">' + w.explain + '</div>';
    if (w.pos) {
      h += '<div style="color:#9aa;font-size:0.85rem;margin-top:2px;">' + w.pos + '</div>';
    }
    if (w.note) {
      h += '<div style="color:#fbbf24;font-size:0.82rem;margin-top:6px;background:rgba(251,191,36,0.08);border-radius:6px;padding:6px;">📝 ' + w.note + '</div>';
    }
    return h;
  }

  $("quizSubmit").addEventListener("click", checkAnswer);
  $("quizInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); checkAnswer(); }
  });
  $("quizSpeakBtn").addEventListener("click", function () {
    if (currentWord) speak(currentWord.word, state.repeat, null, currentWord.idx);
  });
  $("quizNext").addEventListener("click", function () {
    state.idx++;
    nextQuiz();
  });
  $("quizPrev").addEventListener("click", function () {
    // 回到上一个已答的单词，重新出题
    if (state.quizHistory.length > 0) {
      state.idx = state.quizHistory.pop();
      // 如果回退的是错词，从错词集合里去掉，避免重复计错
      var w = state.queue[state.idx];
      var wi = state.wrongSet.indexOf(w);
      if (wi >= 0) state.wrongSet.splice(wi, 1);
      nextQuiz();
    }
  });
  $("quizExit").addEventListener("click", goHome);

  // 输入方式切换
  $("inputMode").querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () {
      $("inputMode").querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      state.inputMode = b.dataset.im;
      if (state.inputMode === "spell") {
        $("quizSpellArea").classList.remove("hidden");
        $("drawWrap").classList.remove("show");
      } else {
        $("quizSpellArea").classList.add("hidden");
        $("drawWrap").classList.add("show");
        initDraw();
      }
    });
  });

  // ====== 虚拟韩文键盘 ======
  var KBD = {
    consonant: [
      "ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ",
      "ㅋ","ㅌ","ㅍ","ㅎ","ㄲ","ㄸ","ㅃ","ㅆ","ㅉ"
    ],
    vowel: [
      "ㅏ","ㅑ","ㅓ","ㅕ","ㅗ","ㅛ","ㅜ","ㅠ","ㅡ","ㅣ",
      "ㅐ","ㅒ","ㅔ","ㅖ","ㅘ","ㅙ","ㅚ","ㅝ","ㅞ","ㅟ","ㅢ"
    ],
    complex: [
      "ㄳ","ㄵ","ㄶ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅄ"
    ]
  };
  var kbdTab = "consonant";
  function renderKbd() {
    var keys = KBD[kbdTab].slice();
    keys.push("⌫"); // 退格
    keys.push("空"); // 空格
    var cols = kbdTab === "vowel" ? 7 : 7;
    var html = "";
    html += '<div style="display:grid;grid-template-columns:repeat(' + cols + ',1fr);gap:3px;">';
    keys.forEach(function (k) {
      var cls = (k === "⌫" || k === "空") ? 'special' : '';
      html += '<button class="' + cls + '" data-key="' + k + '">' + k + '</button>';
    });
    html += '</div>';
    $("kbdGrid").innerHTML = html;
    $("kbdGrid").querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () {
        var k = b.dataset.key;
        var inp = $("quizInput");
        if (k === "⌫") {
          inp.value = inp.value.slice(0, -1);
        } else if (k === "空") {
          inp.value += " ";
        } else {
          inp.value += k;
        }
        inp.focus();
      });
    });
  }
  $("keyboard").querySelectorAll(".keyboard-tabs button").forEach(function (b) {
    b.addEventListener("click", function () {
      $("keyboard").querySelectorAll(".keyboard-tabs button").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      kbdTab = b.dataset.kbd;
      renderKbd();
    });
  });

  // 组装韩文字符：把输入的字母序列组合成韩文音节
  // 简单实现：直接把字母拼接，浏览器/输入框不自动组合。
  // 为了能组合，我们做基本的两字母/三字母组合：辅音+元音 => 音节
  // 这里采用：用户点字母后，尝试把末尾的(辅音+元音)组合成音节
  // 组合函数：把一串辅音/元音字母转成韩文音节字符串
  // 算法已用 616 个单词验证：分解->重组 全部一致
  function composeHangul(jamos) {
    var consList = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
    var vowelList = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
    var tailArr = "ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ".split("");
    var tailMap = {};
    tailArr.forEach(function (c, idx) { tailMap[c] = idx + 1; });
    function isCons(c) { return consList.indexOf(c) >= 0; }
    function isVowel(c) { return vowelList.indexOf(c) >= 0; }
    function isTail(c) { return tailMap[c] !== undefined; }

    var result = "", i = 0;
    while (i < jamos.length) {
      if (isCons(jamos[i]) && i + 1 < jamos.length && isVowel(jamos[i+1])) {
        var lead = consList.indexOf(jamos[i]);
        var vowel = vowelList.indexOf(jamos[i+1]);
        var tailCode = 0, consumed = 2;
        var c3 = jamos[i+2];
        if (c3 !== undefined) {
          if (isCons(c3)) {
            // 单辅音：下一个是元音则作下一音节初声，否则作收音
            if (i + 3 < jamos.length && isVowel(jamos[i+3])) {
              // c3 作下一音节初声，当前无收音
            } else if (isTail(c3)) {
              tailCode = tailMap[c3];
              consumed = 3;
            }
          } else if (isTail(c3)) {
            // 复合收音字母（ㄳㄵㄶㄺㄻㄼㄽㄾㄿㅀㅄ等）只能作收音
            tailCode = tailMap[c3];
            consumed = 3;
          }
        }
        var code = 0xAC00 + (lead * 21 + vowel) * 28 + tailCode;
        result += String.fromCharCode(code);
        i += consumed;
      } else {
        result += jamos[i];
        i++;
      }
    }
    return result;
  }

  // 改写键盘点击：实时组合
  function getRawJamos() {
    // 从 input 的 data-raw 属性存原始字母
    return $("quizInput").dataset.raw || "";
  }
  function setRawJamos(s) {
    $("quizInput").dataset.raw = s;
  }
  // 重新渲染键盘事件
  function bindKbdButtons() {
    $("kbdGrid").querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        var k = b.dataset.key;
        var raw = getRawJamos();
        if (k === "⌫") {
          raw = raw.slice(0, -1);
        } else if (k === "空") {
          raw += " ";
        } else {
          raw += k;
        }
        setRawJamos(raw);
        $("quizInput").value = composeHangul(raw);
        $("quizInput").focus();
      };
    });
  }
  // 覆盖 renderKbd 以绑定新事件
  var origRenderKbd = renderKbd;
  renderKbd = function () {
    origRenderKbd();
    bindKbdButtons();
  };

  // ====== 手写画板 ======
  var drawCtx = null, drawing = false, hasDrawn = false;
  function initDraw() {
    var canvas = $("drawCanvas");
    // 设置尺寸
    var w = canvas.parentElement.clientWidth - 4;
    canvas.width = w;
    canvas.height = 200;
    drawCtx = canvas.getContext("2d");
    drawCtx.fillStyle = "#fff";
    drawCtx.fillRect(0, 0, canvas.width, canvas.height);
    drawCtx.strokeStyle = "#1a1a2e";
    drawCtx.lineWidth = 3;
    drawCtx.lineCap = "round";
    drawCtx.lineJoin = "round";
    hasDrawn = false;

    function pos(e) {
      var r = canvas.getBoundingClientRect();
      var t = e.touches ? e.touches[0] : e;
      return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
    }
    function start(e) { e.preventDefault(); drawing = true; var p = pos(e); drawCtx.beginPath(); drawCtx.moveTo(p.x, p.y); hasDrawn = true; }
    function move(e) { if (!drawing) return; e.preventDefault(); var p = pos(e); drawCtx.lineTo(p.x, p.y); drawCtx.stroke(); }
    function end(e) { e.preventDefault(); drawing = false; }
    canvas.onmousedown = start;
    canvas.onmousemove = move;
    canvas.onmouseup = end;
    canvas.onmouseleave = end;
    canvas.ontouchstart = start;
    canvas.ontouchmove = move;
    canvas.ontouchend = end;
  }
  function clearDraw() {
    var canvas = $("drawCanvas");
    if (!canvas || !drawCtx) return;
    drawCtx.fillStyle = "#fff";
    drawCtx.fillRect(0, 0, canvas.width, canvas.height);
    hasDrawn = false;
  }
  $("drawClear").addEventListener("click", clearDraw);

  // ====== 统计页 ======
  function showSummary(mode) {
    show("summaryView");
    var html = "";
    if (mode === "quiz") {
      var total = state.queue.length + state.wrongSet.length; // 注意：重练后 queue 已变
      // 简单统计：本轮处理的单词数
      html += '<div class="stat-line">本轮单词数：' + (state.idx) + '</div>';
      // 统计错词
      var wrongCount = 0;
      // 从 progress 不准确，用 wrongSet 近似
      html += '<div class="stat-line bad">需重点复习：' + state.wrongSet.length + ' 个</div>';
    } else {
      html += '<div class="stat-line">已完成学习：' + state.queue.length + ' 个单词</div>';
    }
    // 全局进度
    var totalAll = 0, seenAll = 0, correctAll = 0;
    (window.WORDS || []).forEach(function (w) {
      totalAll++;
      var p = progress[w.word];
      if (p) { seenAll++; correctAll += p.correct; }
    });
    html += '<hr style="border-color:#2a3b66;margin:10px 0;">';
    html += '<div class="stat-line">累计练习：' + seenAll + ' / ' + totalAll + '</div>';
    html += '<div class="stat-line ok">累计答对：' + correctAll + ' 次</div>';
    $("summaryContent").innerHTML = html;
    renderProgress();
  }
  $("summaryAgain").addEventListener("click", function () {
    if (state.mode === "study") startStudy(); else startQuiz();
  });
  $("summaryHome").addEventListener("click", goHome);

  // ====== 首页交互 ======
  function goHome() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    show("home");
    renderProgress();
    renderVoiceStatus();
  }
  $("lessonList").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b) selectLesson(parseInt(b.dataset.lesson, 10));
  });
  $("modeSelect").querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () {
      $("modeSelect").querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      state.mode = b.dataset.mode;
      $("quizOptions").style.display = (state.mode === "quiz") ? "" : "none";
    });
  });
  $("quizType").querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () {
      $("quizType").querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      state.quizType = b.dataset.type;
    });
  });
  $("orderType").querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () {
      $("orderType").querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      state.order = b.dataset.order;
    });
  });
  $("repeatType").querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () {
      $("repeatType").querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      state.repeat = parseInt(b.dataset.repeat, 10);
    });
  });
  $("gapType").querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () {
      $("gapType").querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      gapMs = parseInt(b.dataset.gap, 10);
    });
  });
  $("retryType").querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () {
      $("retryType").querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      state.retryWrong = b.dataset.retry === "1";
    });
  });
  $("startBtn").addEventListener("click", function () {
    warmUpTTS(); // 用户手势里预热，iOS 上让后续自动朗读能出声
    if (state.mode === "study") startStudy();
    else startQuiz();
  });
  $("voiceTestBtn").addEventListener("click", function () {
    warmUpTTS();
    // 播放词表第一个单词的预生成音频，测试发音功能
    var first = (window.WORDS && window.WORDS.length) ? window.WORDS[0] : null;
    if (first) speak(first.word, 1, null, first.idx);
    else speak("안녕하세요", 1);
  });
  $("clearProgressBtn").addEventListener("click", function () {
    if (confirm("确定清除全部练习进度？此操作不可撤销。")) {
      progress = {};
      saveProgress(progress);
      renderProgress();
    }
  });

  // ====== 初始化 ======
  buildLessonList();
  renderKbd();
  renderProgress();
  goHome();

})();
</script>
