<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>韩语记单词</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1a1a2e;
    color: #e6e6e6;
    line-height: 1.5;
    padding: 12px;
    overflow-x: hidden;
  }
  h1 { font-size: 1.3rem; text-align: center; margin-bottom: 10px; letter-spacing: 1px; }
  h1 .ko { color: #4ade80; }

  /* 卡片 */
  .card {
    background: #16213e;
    border: 1px solid #2a3b66;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }

  /* 通用控件 */
  label { font-size: 0.88rem; color: #9aa; display: block; margin-bottom: 4px; }
  select, button, input[type=number] {
    background: #0f1a30;
    color: #e6e6e6;
    border: 1px solid #2a3b66;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: inherit;
  }
  select:hover, button:hover { border-color: #4ade80; }
  button.primary { background: #2563eb; border-color: #2563eb; }
  button.primary:hover { background: #1d4ed8; }
  button.danger { background: #b91c1c; border-color: #b91c1c; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 0 0 auto; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button { padding: 6px 10px; font-size: 0.85rem; }
  .seg button.active { background: #2563eb; border-color: #2563eb; }

  /* 首页：课程列表 */
  #home .lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
  #home .lessons button {
    padding: 14px 0;
    text-align: center;
    font-size: 0.95rem;
  }
  #home .lessons button .cnt { display: block; font-size: 0.72rem; color: #9aa; margin-top: 2px; }

  /* 单词显示 */
  .word-ko { font-size: 2.6rem; text-align: center; letter-spacing: 1px; margin: 8px 0; }
  .word-explain { font-size: 1.2rem; text-align: center; color: #cdd; margin-bottom: 6px; }
  .word-meta { text-align: center; font-size: 0.85rem; color: #9aa; }
  .word-note { text-align: center; font-size: 0.82rem; color: #fbbf24; margin-top: 6px; background: rgba(251,191,36,0.08); border-radius: 6px; padding: 6px; }
  .progress { font-size: 0.8rem; color: #9aa; text-align: center; margin-bottom: 8px; }

  /* 听写 */
  .quiz-prompt { text-align: center; font-size: 1.15rem; color: #cdd; margin: 10px 0; min-height: 2rem; }
  .quiz-input-area { margin: 10px 0; }
  .quiz-answer-input {
    width: 100%;
    text-align: center;
    font-size: 1.8rem;
    letter-spacing: 2px;
    background: #0f1a30;
    color: #4ade80;
    border: 2px solid #2a3b66;
    border-radius: 8px;
    padding: 10px;
    font-family: inherit;
  }
  .quiz-answer-input:focus { outline: none; border-color: #4ade80; }
  .quiz-correct { color: #4ade80; }
  .quiz-wrong { color: #f87171; }
  .quiz-result { text-align: center; margin: 10px 0; }
  .quiz-result .correct-ko { font-size: 1.8rem; color: #4ade80; }
  .quiz-result .your-ko { font-size: 1.1rem; color: #f87171; text-decoration: line-through; }

  /* 虚拟键盘 */
  .keyboard { margin-top: 10px; }
  .keyboard-tabs { display: flex; gap: 4px; margin-bottom: 6px; }
  .keyboard-tabs button { padding: 4px 10px; font-size: 0.8rem; }
  .keyboard-tabs button.active { background: #2563eb; border-color: #2563eb; }
  .keyboard-grid { display: grid; gap: 3px; }
  .keyboard-grid button {
    padding: 10px 0;
    font-size: 1rem;
    text-align: center;
    background: #0f1a30;
  }
  .keyboard-grid button:hover { background: #1a2950; }
  .keyboard-grid button.special { font-size: 0.75rem; color: #9aa; }

  /* 手写画板 */
  .draw-wrap { display: none; }
  .draw-wrap.show { display: block; }
  .draw-canvas {
    background: #fff;
    border: 2px solid #2a3b66;
    border-radius: 8px;
    width: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  .draw-controls { display: flex; gap: 6px; margin-top: 6px; justify-content: center; }

  /* 隐藏 */
  .hidden { display: none !important; }

  /* 导航底栏 */
  .navbar {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
  }
  .navbar button { flex: 1; padding: 10px; }

  /* 结果统计 */
  .stat-line { font-size: 0.95rem; margin: 4px 0; }
  .stat-line .ok { color: #4ade80; }
  .stat-line .bad { color: #f87171; }

  /* 错题集 */
  .wrongbook-summary { font-size: 0.85rem; color: #9aa; margin-bottom: 10px; text-align: center; }
  .wrongbook-summary .hl { color: #4ade80; font-weight: bold; }
  .wrongbook-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  .wrongbook-filters select { flex: 1; min-width: 100px; }
  .wrongbook-item {
    background: #16213e;
    border: 1px solid #2a3b66;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .wrongbook-item .wb-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .wrongbook-item .wb-word { font-size: 1.6rem; color: #4ade80; letter-spacing: 1px; }
  .wrongbook-item .wb-badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .wrongbook-item .wb-explain { font-size: 1.05rem; color: #cdd; margin: 2px 0; }
  .wrongbook-item .wb-meta { font-size: 0.82rem; color: #9aa; }
  .wrongbook-item .wb-note { font-size: 0.8rem; color: #fbbf24; margin-top: 6px; background: rgba(251,191,36,0.08); border-radius: 6px; padding: 6px; }
  .wrongbook-item .wb-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .wrongbook-item .wb-actions button { font-size: 0.8rem; padding: 6px 10px; }
  .wrongbook-empty { text-align: center; color: #9aa; padding: 30px 0; font-size: 0.95rem; }

  @media (max-width: 500px) {
    .word-ko { font-size: 2.2rem; }
    h1 { font-size: 1.1rem; }
  }
</style>
</head>
<body>
<h1>韩语记单词 <span class="ko">한국어</span></h1>

<!-- 错误提示（正常时不显示，用于诊断） -->
<div id="errorBox" style="display:none;background:#7f1d1d;border:1px solid #ef4444;border-radius:8px;padding:10px;margin:8px 0;font-size:0.85rem;color:#fecaca;white-space:pre-wrap;word-break:break-all;"></div>

<!-- ========== 首页 ========== -->
<div id="home">
  <div class="card">
    <label>选择课程</label>
    <div class="lessons" id="lessonList"></div>
  </div>
  <div class="card">
    <label>模式选择</label>
    <div class="seg" id="modeSelect" style="margin-top:6px;">
      <button data-mode="study" class="active">学习</button>
      <button data-mode="quiz">听写复习</button>
    </div>
  </div>
  <div class="card">
    <button class="primary" id="openWrongbook" style="width:100%;padding:12px;font-size:1.05rem;">📕 错题集</button>
  </div>
  <div class="card" id="quizOptions" style="display:none;">
    <label>听写设置</label>
    <div style="margin-top:6px;">
      <label style="margin-top:8px;">出题方式</label>
      <div class="seg" id="quizType">
        <button data-type="sound" class="active">读发音+中文</button>
        <button data-type="meaning">只看中文</button>
      </div>
      <label style="margin-top:10px;">顺序</label>
      <div class="seg" id="orderType">
        <button data-order="seq" class="active">正序</button>
        <button data-order="rev">倒序</button>
        <button data-order="rand">随机</button>
      </div>
      <label style="margin-top:10px;">每个单词朗读遍数</label>
      <div class="seg" id="repeatType">
        <button data-repeat="1" class="active">1 遍</button>
        <button data-repeat="2">2 遍</button>
        <button data-repeat="3">3 遍</button>
        <button data-repeat="4">4 遍</button>
        <button data-repeat="5">5 遍</button>
      </div>
      <label style="margin-top:10px;">每遍间隔（反应时间）</label>
      <div class="seg" id="gapType">
        <button data-gap="500">0.5 秒</button>
        <button data-gap="1500" class="active">1.5 秒</button>
        <button data-gap="3000">3 秒</button>
        <button data-gap="5000">5 秒</button>
      </div>
      <label style="margin-top:10px;">答错词优先重练</label>
      <div class="seg" id="retryType">
        <button data-retry="1" class="active">开</button>
        <button data-retry="0">关</button>
      </div>
    </div>
  </div>
  <div class="card">
    <button class="primary" id="startBtn" style="width:100%;padding:12px;font-size:1.05rem;">开始</button>
  </div>
  <div class="card" id="voiceCard">
    <label>🔊 发音状态</label>
    <div id="voiceInfo" style="font-size:0.85rem;color:#9aa;margin-top:6px;">检测中...</div>
    <button id="voiceTestBtn" style="margin-top:8px;font-size:0.85rem;">测试发音</button>
    <div id="voiceHelp" style="font-size:0.78rem;color:#fbbf24;margin-top:6px;display:none;">
      没有声音？iPhone/iPad 需在「设置 → 辅助功能 → 朗读内容 → 声音」里下载「韩语」语音，然后回到本页刷新。
    </div>
  </div>
  <div class="card" id="progressCard">
    <label>复习进度（保存在本机）</label>
    <div id="progressInfo" style="font-size:0.85rem;color:#9aa;margin-top:6px;">加载中...</div>
    <button id="clearProgressBtn" style="margin-top:8px;font-size:0.8rem;" class="danger">清除全部进度</button>
  </div>
</div>

<!-- ========== 学习模式 ========== -->
<div id="studyView" class="hidden">
  <div class="progress" id="studyProgress"></div>
  <div class="card">
    <div class="word-ko" id="studyWord"></div>
    <div class="word-explain" id="studyExplain"></div>
    <div class="word-meta" id="studyMeta"></div>
    <div class="word-note hidden" id="studyNote"></div>
    <div style="text-align:center;margin-top:12px;">
      <button id="studySpeakBtn" style="font-size:1rem;padding:10px 20px;">🔊 读发音</button>
    </div>
  </div>
  <div class="navbar">
    <button id="studyPrev">← 上一个</button>
    <button id="studyAuto" class="primary">自动朗读</button>
    <button id="studyNext">下一个 →</button>
  </div>
  <div class="navbar">
    <button id="studyExit">返回首页</button>
  </div>
</div>

<!-- ========== 听写模式 ========== -->
<div id="quizView" class="hidden">
  <div class="progress" id="quizProgress"></div>
  <div class="card">
    <div class="quiz-prompt" id="quizPrompt"></div>
    <div style="text-align:center;margin-bottom:8px;">
      <button id="quizSpeakBtn">🔊 再听一遍</button>
    </div>

    <!-- 拼写输入区 -->
    <div class="quiz-input-area" id="quizSpellArea">
      <input type="text" class="quiz-answer-input" id="quizInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="用键盘或下方虚拟键盘输入">
      <!-- 虚拟键盘 -->
      <div class="keyboard" id="keyboard">
        <div class="keyboard-tabs">
          <button data-kbd="consonant" class="active">辅音</button>
          <button data-kbd="vowel">元音</button>
          <button data-kbd="complex">复合</button>
        </div>
        <div class="keyboard-grid" id="kbdGrid"></div>
      </div>
    </div>

    <!-- 手写画板区 -->
    <div class="draw-wrap" id="drawWrap">
      <canvas class="draw-canvas" id="drawCanvas"></canvas>
      <div class="draw-controls">
        <button id="drawClear">清空</button>
      </div>
    </div>

    <!-- 答案显示区 -->
    <div class="quiz-result hidden" id="quizResult"></div>

    <div class="word-note hidden" id="quizNote"></div>
  </div>

  <!-- 输入方式切换 -->
  <div class="seg" id="inputMode" style="margin-bottom:8px;">
    <button data-im="spell" class="active">拼写输入</button>
    <button data-im="draw">手写输入</button>
  </div>

  <div class="navbar">
    <button id="quizPrev" disabled>← 上一个</button>
    <button id="quizSubmit" class="primary">提交 / 看答案</button>
    <button id="quizNext" class="hidden">下一个 →</button>
  </div>
  <div class="navbar">
    <button id="quizExit">返回首页</button>
  </div>
</div>

<!-- ========== 结束统计 ========== -->
<div id="summaryView" class="hidden">
  <div class="card">
    <h2 style="text-align:center;margin-bottom:12px;">本轮结束 🎉</h2>
    <div id="summaryContent"></div>
  </div>
  <div class="navbar">
    <button id="summaryAgain" class="primary">再来一轮</button>
    <button id="summaryHome">返回首页</button>
  </div>
</div>

<!-- ========== 错题集 ========== -->
<div id="wrongbookView" class="hidden">
  <div class="card">
    <h2 style="text-align:center;margin-bottom:8px;">📕 错题集</h2>
    <div class="wrongbook-summary" id="wrongbookSummary"></div>
    <div class="wrongbook-filters">
      <select id="wrongbookFilter">
        <option value="all">全部</option>
        <option value="due">待复习</option>
        <option value="mastered">已掌握</option>
      </select>
      <select id="wrongbookLesson">
        <option value="0">全部课程</option>
      </select>
    </div>
    <div id="wrongbookList"></div>
    <div style="margin-top:10px;display:flex;gap:8px;">
      <button id="wrongbookReview" class="primary" style="flex:1;">▶ 复习错题</button>
      <button id="wrongbookClear" class="danger" style="flex:0 0 auto;">清空</button>
    </div>
  </div>
  <div class="navbar">
    <button id="wrongbookBack">返回首页</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // 全局错误捕获：任何 JS 错误都显示到页面上，方便诊断
  window.onerror = function (msg, src, line, col) {
    try {
      var el = document.getElementById("errorBox");
      if (el) {
        el.style.display = "block";
        el.textContent = "⚠️ 出错了：" + msg + "\n位置：第 " + line + " 行";
      }
    } catch (e) {}
    return false;
  };

  // ====== 单词数据按课分组 ======
  var LESSONS = {};
  var LESSON_NUMS = [];
  (window.WORDS || []).forEach(function (w) {
    if (!LESSONS[w.lesson]) { LESSONS[w.lesson] = []; LESSON_NUMS.push(w.lesson); }
    LESSONS[w.lesson].push(w);
  });
  LESSON_NUMS.sort(function (a, b) { return a - b; });

  // ====== 进度存储 ======
  var STORE_KEY = "hangeul_progress_v1";
  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function saveProgress(p) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch (e) {}
  }
  var progress = loadProgress();
  function recordResult(word, ok) {
    if (!progress[word]) progress[word] = { seen: 0, correct: 0, wrong: 0 };
    progress[word].seen++;
    if (ok) progress[word].correct++; else progress[word].wrong++;
    saveProgress(progress);
  }

  // ====== 错题集（错误次数递减法）======
  var WRONGBOOK_KEY = "hangeul_wrongbook_v1";
  function loadWrongbook() {
    try { return JSON.parse(localStorage.getItem(WRONGBOOK_KEY) || "{}"); }
    catch (e) { return {}; }
  }
  function saveWrongbook(wb) {
    try { localStorage.setItem(WRONGBOOK_KEY, JSON.stringify(wb)); } catch (e) {}
  }
  var wrongbook = loadWrongbook();

  // 根据当前错误次数计算复习间隔（毫秒）
  function wrongbookInterval(err) {
    if (err >= 5) return 1 * 86400000; // 每天复习
    if (err >= 3) return 2 * 86400000; // 每2天复习
    if (err >= 1) return 3 * 86400000; // 每3天复习
    return 7 * 86400000;               // 已掌握，每周抽查
  }
  function wrongbookIntervalText(err) {
    if (err >= 5) return "每天复习";
    if (err >= 3) return "每2天复习";
    if (err >= 1) return "每3天复习";
    return "每周抽查";
  }

  // 答题时更新错题集：答错 err+1 立即排最前，答对 err-1（减到0为止）
  function updateWrongbook(w, ok) {
    if (!w || !w.id) return;
    var key = w.id;
    var now = Date.now();
    if (ok) {
      var e = wrongbook[key];
      if (!e || e.total === 0) return; // 从没错过，答对不纳入错题集
      e.err = Math.max(0, e.err - 1);
      e.lastReview = now;
      e.nextReview = now + wrongbookInterval(e.err);
      saveWrongbook(wrongbook);
    } else {
      var e2 = wrongbook[key];
      if (!e2) {
        e2 = wrongbook[key] = {
          err: 0, total: 0,
          word: w.word, lesson: w.lesson, pos: w.pos || "", explain: w.explain || "", note: w.note || "",
          lastWrong: 0, lastReview: 0, nextReview: 0
        };
      }
      // 同步最新信息（词义可能更新过）
      e2.word = w.word; e2.lesson = w.lesson; e2.pos = w.pos || ""; e2.explain = w.explain || ""; e2.note = w.note || "";
      e2.err += 1;
      e2.total += 1;
      e2.lastWrong = now;
      e2.nextReview = now; // 答错立即排最前待复习
      saveWrongbook(wrongbook);
    }
  }

  // 取错题集条目（错误次数降序、最近答错优先）
  function getWrongbookItems() {
    var arr = [];
    Object.keys(wrongbook).forEach(function (id) {
      var e = wrongbook[id];
      if (!e || e.total === 0) return;
      arr.push({ id: id, err: e.err, total: e.total, word: e.word, lesson: e.lesson, pos: e.pos, explain: e.explain, note: e.note, lastWrong: e.lastWrong, lastReview: e.lastReview, nextReview: e.nextReview });
    });
    arr.sort(function (a, b) {
      if (a.err !== b.err) return b.err - a.err;
      return b.lastWrong - a.lastWrong;
    });
    return arr;
  }

  function isDue(e) {
    return Date.now() >= (e.nextReview || 0);
  }

  function renderWrongbook() {
    var filter = $("wrongbookFilter").value;
    var lessonFilter = parseInt($("wrongbookLesson").value, 10) || 0;
    var items = getWrongbookItems();
    var dueCount = items.filter(isDue).length;
    var masteredCount = items.filter(function (e) { return e.err === 0; }).length;

    $("wrongbookSummary").innerHTML =
      '共 <span class="hl">' + items.length + '</span> 个错词 · ' +
      '待复习 <span class="hl">' + dueCount + '</span> · ' +
      '已掌握 <span class="hl">' + masteredCount + '</span>';

    // 填充课程筛选（保留已选值）
    var curLesson = lessonFilter;
    var lessonOpts = '<option value="0">全部课程</option>';
    LESSON_NUMS.forEach(function (n) {
      lessonOpts += '<option value="' + n + '"' + (curLesson === n ? ' selected' : '') + '>第' + n + '课</option>';
    });
    $("wrongbookLesson").innerHTML = lessonOpts;

    var filtered = items.filter(function (e) {
      if (lessonFilter && e.lesson !== lessonFilter) return false;
      if (filter === "due") return isDue(e);
      if (filter === "mastered") return e.err === 0;
      return true;
    });

    if (filtered.length === 0) {
      $("wrongbookList").innerHTML = '<div class="wrongbook-empty">' +
        (items.length === 0 ? '还没有错题。去做「听写复习」吧，答错的词会自动收进来～' : '当前筛选下没有单词') +
        '</div>';
      $("wrongbookReview").disabled = (dueCount === 0);
      return;
    }

    var html = "";
    filtered.forEach(function (e) {
      var st;
      if (e.err === 0) {
        st = isDue(e) ? { label: "待抽查", color: "#f59e0b" } : { label: "已掌握", color: "#2563eb" };
      } else {
        st = isDue(e) ? { label: "待复习", color: "#b91c1c" } : { label: "未到期", color: "#6b7280" };
      }
      html += '<div class="wrongbook-item">' +
        '<div class="wb-top">' +
          '<span class="wb-word">' + e.word + '</span>' +
          '<span class="wb-badge" style="background:' + st.color + ';color:#fff;">' + st.label + '</span>' +
        '</div>' +
        '<div class="wb-explain">' + e.explain + '</div>' +
        '<div class="wb-meta">第' + e.lesson + '课 · ' + (e.pos || '—') + ' · 错 ' + e.err + ' 次 · ' + wrongbookIntervalText(e.err) + '</div>' +
        (e.note ? '<div class="wb-note">📝 ' + e.note + '</div>' : '') +
        '<div class="wb-actions">' +
          '<button data-speak="' + e.id + '" data-word="' + e.word + '">🔊 发音</button>' +
        '</div>' +
        '</div>';
    });
    $("wrongbookList").innerHTML = html;

    $("wrongbookList").querySelectorAll("button[data-speak]").forEach(function (b) {
      b.addEventListener("click", function () {
        speak(b.dataset.word, 1, null, b.dataset.speak);
      });
    });

    $("wrongbookReview").disabled = (dueCount === 0);
  }

  function reviewWrongbook() {
    var items = getWrongbookItems().filter(isDue);
    if (items.length === 0) {
      alert("没有待复习的错词了 🎉");
      goHome();
      return;
    }
    state.queue = items.map(function (e) {
      return { word: e.word, lesson: e.lesson, pos: e.pos, explain: e.explain, note: e.note, id: e.id };
    });
    state.wrongSet = [];
    state.quizHistory = [];
    state.idx = 0;
    state.fromWrongbook = true;
    show("quizView");
    nextQuiz();
  }

  // ====== TTS ======
  var gapMs = 1500; // 朗读间隔（毫秒），可在听写设置里调整
  var ttsVoice = null;
  var koVoices = [];
  function pickVoice() {
    try {
      var v = speechSynthesis.getVoices();
      var voices = (v && v.length) ? v : [];
      koVoices = voices.filter(function (x) {
        return x && (x.lang || "").toLowerCase().indexOf("ko") === 0;
      });
      // 优先选韩语，且优先「韩国」口音
      ttsVoice = koVoices.filter(function (x) { return (x.lang || "").indexOf("ko-KR") === 0; })[0]
        || koVoices[0]
        || null;
    } catch (e) {
      koVoices = [];
      ttsVoice = null;
    }
  }
  // 语音引擎初始化绝不阻塞主流程：任何异常都吞掉
  try {
    if ('speechSynthesis' in window) {
      pickVoice();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = pickVoice;
      }
    }
  } catch (e) {}

  // 检测韩语语音是否可用（用于首页提示）
  function checkVoiceStatus() {
    try {
      if (!('speechSynthesis' in window)) {
        return { ok: false, msg: "此浏览器不支持语音朗读" };
      }
      if (koVoices.length > 0) {
        return { ok: true, msg: "韩语发音可用 ✓" };
      }
      return { ok: false, msg: "未检测到韩语语音 → 见下方说明" };
    } catch (e) {
      return { ok: false, msg: "语音功能不可用" };
    }
  }

  // 预热：iOS 上必须在用户手势里触发一次，后续自动朗读才出声
  function warmUpTTS() {
    try {
      if (!('speechSynthesis' in window)) return;
      pickVoice();
      var u = new SpeechSynthesisUtterance(" ");
      u.volume = 0;
      u.lang = "ko-KR";
      if (ttsVoice) u.voice = ttsVoice;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  function speakTTS(text, times, cb) {
    try {
      if (!('speechSynthesis' in window)) { if (cb) cb(); return; }
    } catch (e) { if (cb) cb(); return; }
    times = times || 1;
    var i = 0;
    function once() {
      if (i >= times) { if (cb) cb(); return; }
      i++;
      try {
        if (!ttsVoice) pickVoice(); // 语音列表可能刚加载完
        try { speechSynthesis.cancel(); } catch (e) {}
        var u = new SpeechSynthesisUtterance(text);
        u.lang = "ko-KR";
        if (ttsVoice) u.voice = ttsVoice;
        u.rate = 0.9;
        u.onend = function () { setTimeout(once, gapMs); };
        u.onerror = function () { setTimeout(once, gapMs); };
        speechSynthesis.speak(u);
      } catch (e) {
        // 语音失败不影响其他功能，直接跳到下一遍
        setTimeout(once, gapMs);
      }
    }
    once();
  }

  // 统一朗读入口：优先用预生成音频（audio/{id}.m4a），失败则回退到浏览器 TTS
  function speak(text, times, cb, id) {
    times = times || 1;
    // id 现在是单词内容的哈希字符串，只要非空就走音频
    var hasAudio = (id !== null && id !== undefined && id !== "");
    if (!hasAudio) {
      speakTTS(text, times, cb);
      return;
    }
    var i = 0;
    function next() {
      if (i >= times) { if (cb) cb(); return; }
      i++;
      var a = new Audio("audio/" + id + ".m4a");
      var finished = false;
      function onDone() {
        if (finished) return;
        finished = true;
        setTimeout(next, gapMs);
      }
      function onFail() {
        if (finished) return;
        finished = true;
        // 音频加载/播放失败，回退到 TTS 播放剩余遍数
        speakTTS(text, times - i + 1, cb);
      }
      a.onended = onDone;
      a.onerror = onFail;
      try {
        var p = a.play();
        if (p && p.catch) p.catch(onFail);
      } catch (e) {
        onFail();
      }
    }
    next();
  }

  // 组装韩文字符：把输入的字母序列组合成韩文音节
  // 简单实现：直接把字母拼接，浏览器/输入框不自动组合。
  // 为了能组合，我们做基本的两字母/三字母组合：辅音+元音 => 音节
  // 这里采用：用户点字母后，尝试把末尾的(辅音+元音)组合成音节
  // 组合函数：把一串辅音/元音字母转成韩文音节字符串
  // 算法已用 616 个单词验证：分解->重组 全部一致
  function composeHangul(jamos) {
    var consList = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
    var vowelList = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
    var tailArr = "ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ".split("");
    var tailMap = {};
    tailArr.forEach(function (c, idx) { tailMap[c] = idx + 1; });
    function isCons(c) { return consList.indexOf(c) >= 0; }
    function isVowel(c) { return vowelList.indexOf(c) >= 0; }
    function isTail(c) { return tailMap[c] !== undefined; }

    var result = "", i = 0;
    while (i < jamos.length) {
      if (isCons(jamos[i]) && i + 1 < jamos.length && isVowel(jamos[i+1])) {
        var lead = consList.indexOf(jamos[i]);
        var vowel = vowelList.indexOf(jamos[i+1]);
        var tailCode = 0, consumed = 2;
        var c3 = jamos[i+2];
        if (c3 !== undefined) {
          if (isCons(c3)) {
            // 单辅音：下一个是元音则作下一音节初声，否则作收音
            if (i + 3 < jamos.length && isVowel(jamos[i+3])) {
              // c3 作下一音节初声，当前无收音
            } else if (isTail(c3)) {
              tailCode = tailMap[c3];
              consumed = 3;
            }
          } else if (isTail(c3)) {
            // 复合收音字母（ㄳㄵㄶㄺㄻㄼㄽㄾㄿㅀㅄ等）只能作收音
            tailCode = tailMap[c3];
            consumed = 3;
          }
        }
        var code = 0xAC00 + (lead * 21 + vowel) * 28 + tailCode;
        result += String.fromCharCode(code);
        i += consumed;
      } else {
        result += jamos[i];
        i++;
      }
    }
    return result;
  }

  // ====== 手写画板 ======
  var drawCtx = null, drawing = false, hasDrawn = false;
  function initDraw() {
    var canvas = $("drawCanvas");
    // 设置尺寸
    var w = canvas.parentElement.clientWidth - 4;
    canvas.width = w;
    canvas.height = 200;
    drawCtx = canvas.getContext("2d");
    drawCtx.fillStyle = "#fff";
    drawCtx.fillRect(0, 0, canvas.width, canvas.height);
    drawCtx.strokeStyle = "#1a1a2e";
    drawCtx.lineWidth = 3;
    drawCtx.lineCap = "round";
    drawCtx.lineJoin = "round";
    hasDrawn = false;

    function pos(e) {
      var r = canvas.getBoundingClientRect();
      var t = e.touches ? e.touches[0] : e;
      return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
    }
    function start(e) { e.preventDefault(); drawing = true; var p = pos(e); drawCtx.beginPath(); drawCtx.moveTo(p.x, p.y); hasDrawn = true; }
    function move(e) { if (!drawing) return; e.preventDefault(); var p = pos(e); drawCtx.lineTo(p.x, p.y); drawCtx.stroke(); }
    function end(e) { e.preventDefault(); drawing = false; }
    canvas.onmousedown = start;
    canvas.onmousemove = move;
    canvas.onmouseup = end;
    canvas.onmouseleave = end;
    canvas.ontouchstart = start;
    canvas.ontouchmove = move;
    canvas.ontouchend = end;
  }
  function clearDraw() {
    var canvas = $("drawCanvas");
    if (!canvas || !drawCtx) return;
    drawCtx.fillStyle = "#fff";
    drawCtx.fillRect(0, 0, canvas.width, canvas.height);
    hasDrawn = false;
  }

      $("orderType").querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      state.order = b.dataset.order;
    });
  });
  $("repeatType").querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () {
      $("repeatType").querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      state.repeat = parseInt(b.dataset.repeat, 10);
    });
  });
  $("gapType").querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () {
      $("gapType").querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      gapMs = parseInt(b.dataset.gap, 10);
    });
  });
  $("retryType").querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () {
      $("retryType").querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
      b.classList.add("active");
      state.retryWrong = b.dataset.retry === "1";
    });
  });
  $("startBtn").addEventListener("click", function () {
    warmUpTTS(); // 用户手势里预热，iOS 上让后续自动朗读能出声
    if (state.mode === "study") startStudy();
    else startQuiz();
  });
  $("voiceTestBtn").addEventListener("click", function () {
    warmUpTTS();
    // 播放词表第一个单词的预生成音频，测试发音功能
    var first = (window.WORDS && window.WORDS.length) ? window.WORDS[0] : null;
    if (first) speak(first.word, 1, null, first.id);
    else speak("안녕하세요", 1);
  });
  $("clearProgressBtn").addEventListener("click", function () {
    if (confirm("确定清除全部练习进度？此操作不可撤销。")) {
      progress = {};
      saveProgress(progress);
      renderProgress();
    }
  });

  // ====== 错题集交互 ======
  $("openWrongbook").addEventListener("click", function () {
    renderWrongbook();
    show("wrongbookView");
  });
  $("wrongbookBack").addEventListener("click", function () {
    goHome();
  });
  $("wrongbookFilter").addEventListener("change", renderWrongbook);
  $("wrongbookLesson").addEventListener("change", renderWrongbook);
  $("wrongbookReview").addEventListener("click", function () {
    warmUpTTS();
    reviewWrongbook();
  });
  $("wrongbookClear").addEventListener("click", function () {
    if (confirm("确定清空错题集？已掌握的单词也会一并清除。此操作不可撤销。")) {
      wrongbook = {};
      saveWrongbook(wrongbook);
      renderWrongbook();
    }
  });

  // ====== 初始化 ======
  buildLessonList();
  renderKbd();
  renderProgress();
  goHome();

})();
</script>
</body>
</html>
